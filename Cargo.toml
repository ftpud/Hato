[package]
name = "hato"
version = "0.1.0"
edition = "2021"
description = "Hato: self-modifying native desktop platform (Rust microkernel + hot-swappable TypeScript modules)"
license = "Apache-2.0"

[[bin]]
name = "hato"
path = "kernel/src/main.rs"

[lib]
name = "hato_kernel"
path = "kernel/src/lib.rs"

[dependencies]
# GPUI pinned through gpui-kit 0.8.1 (gpui-pre 0.3.10). See docs/COMPATIBILITY.md.
gpui-kit = { version = "=0.8.1", optional = true }
gpui-component = { version = "=0.8.1", features = ["tree-sitter-languages"], optional = true }
rquickjs = { version = "=0.14.0", features = ["std"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "limits"] }
portable-pty = "=0.9.0"
alacritty_terminal = "=0.26.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png", "tiff", "bmp"], optional = true }
similar = "2.7"
dirs = "6"
log = { version = "0.4", features = ["std"] }
libc = "0.2"
notify = { version = "=8.2.1", default-features = false, features = ["macos_fsevent"] }
# HTTPS client for the capability-gated `net.fetch` primitive (OAuth discovery/token exchange).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.2.2", features = ["NSApplication", "NSImage"], optional = true }
objc2-foundation = { version = "=0.2.2", features = ["NSData", "NSThread"], optional = true }

[features]
# The desktop window. Build the headless remote daemon with `--no-default-features`.
default = ["gui"]
gui = ["dep:gpui-kit", "dep:gpui-component", "dep:image", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dev-dependencies]
tempfile = "3"

# Local patch: lets Linux cross-builds use prebuilt shaders (see vendor/gpui-pre-windows/build.rs).
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[[test]]
name = "arch_gate"
path = "kernel/tests/arch_gate.rs"
